name: Sync Horus
on: [push]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Horus2.0 with current Horus
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          git clone --depth 1 https://github.com/Narok94/Horus.git "$TMP_DIR/Horus"
          rsync -a --delete --exclude ".git" "$TMP_DIR/Horus/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: copy Horus into Horus2.0"
          git push --force-with-lease origin HEAD:main
